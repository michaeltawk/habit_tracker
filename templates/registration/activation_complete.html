{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Activated - Habit Tracker</title>
  <link rel="stylesheet" href="{% static 'signup.css' %}">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #6a85f7, #d783ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 2.5rem 3rem;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: #222;
    }

    p {
      font-size: 1rem;
      color: #333;
      margin-bottom: 0.8rem;
      line-height: 1.6;
    }

    a {
      color: #6a85f7;
      font-weight: 500;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Account Activated</h1>
    <p>Thank you for your email confirmation.</p>
    <p>Your account is now activated.</p>
    <p>You can now <a href="{% url 'login' %}">login</a> to your account.</p>
  </div>
</body>
</html>
