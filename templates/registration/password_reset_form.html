{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Your Password</title>
  <link rel="stylesheet" href="{% static 'login.css' %}">  <!-- uses your login styles :contentReference[oaicite:0]{index=0}:contentReference[oaicite:1]{index=1} -->
</head>
<body>
  <div class="container">
    <h1>Forgot your password?</h1>
    <p>Enter your email address below and we'll send you a link to reset it.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" required>
        {{ form.email.errors }}
      </div>
      <button type="submit" class="login-btn">Send reset link</button>
    </form>
    <p class="signup-redirect">
      Remembered it? <a href="{% url 'login' %}">Log in</a>
    </p>
  </div>
</body>
</html>
