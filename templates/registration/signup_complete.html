{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up Complete - Habit Tracker</title>
  <link rel="stylesheet" href="{% static 'signup.css' %}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6a85f7, #d783ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      background-color: white;
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
    }

    .card h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 1rem;
    }

    .card p {
      font-size: 1rem;
      margin-bottom: 0.8rem;
      line-height: 1.6;
    }

    .card a {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      background-color: #6a85f7;
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      transition: background-color 0.3s ease;
      font-weight: 500;
    }

    .card a:hover {
      background-color: #4c65d4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign Up Complete</h1>
    <p>Thank you for signing up for <strong>Habit Tracker</strong>!</p>
    <p>Please check your email for an activation link to verify your account.</p>
    <p>If you don’t see the email, check your spam folder.</p>
    <a href="{% url 'login' %}">Return to Login</a>
  </div>
</body>
</html>
